<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1abc9c"><title>max game — Todos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#34495e;font-family:Arial,"Helvetica Neue",sans-serif}header{background:#2c3e50;color:#fff;padding:22px 24px}header .inner{max-width:640px;margin:auto;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:12px}header i{font-style:normal;color:#1abc9c}.see-all{background:#1abc9c;color:#fff;border-radius:7px;padding:11px 18px;font-size:15px;font-weight:700;opacity:1;cursor:default}.header-toggle{display:inline-block;background:#43586c;color:#fff;text-decoration:none;border:1px solid #6a7d8d;border-radius:7px;padding:11px 16px;font-size:15px;font-weight:700}.header-toggle:hover{background:#526b80}main{max-width:640px;margin:45px auto;padding:0 18px}.list-switch{display:flex;gap:5px;width:max-content;background:#e7edee;padding:5px;border-radius:9px;margin-bottom:29px}.list-switch a{padding:10px 19px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:700;color:#7f8c8d}.list-switch a.current,.list-switch a.nav-action{background:#1abc9c;color:white}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:#1abc9c}h1{font-size:44px;letter-spacing:-2px;margin:9px 0 10px}p{color:#95a5a6;margin:0}.panel{background:white;border-radius:12px;padding:24px;margin-top:30px;box-shadow:0 8px 30px #2c3e5010}.add{display:flex;gap:10px}input{min-width:0;flex:1;border:2px solid #e6eaed;border-radius:7px;padding:15px;font-size:16px;color:#34495e;outline:none}input:focus{border-color:#1abc9c}button{border:0;border-radius:7px;background:#1abc9c;color:white;font-size:15px;font-weight:bold;padding:12px 18px;cursor:pointer}button:hover{filter:brightness(.94)}.tabs{display:flex;gap:7px;margin:24px 0 8px;padding-bottom:16px;border-bottom:1px solid #edf0f2}.tabs button{background:#eef2f4;color:#7f8c8d}.tabs button.active{background:#1abc9c;color:white}ul{padding:0;margin:0;list-style:none}li{display:flex;gap:9px;align-items:center;padding:15px 0;border-bottom:1px solid #eef1f3}li.dragging{opacity:.55;background:#e8faf5;border-radius:8px}li.drag-target{box-shadow:inset 0 3px #1abc9c}.drag-handle{background:transparent;color:#91a3ad;cursor:grab;touch-action:none;padding:9px 5px;font-size:22px;line-height:1;user-select:none}.drag-handle:active{cursor:grabbing}.task-wrap{flex:1;min-width:0}.completed-date{display:block;margin-top:5px;font-size:12px;color:#a5b0b7}.check{width:27px;height:27px;border:2px solid #cbd5d9;border-radius:50%;background:white;flex:none;padding:0}.done .check{background:#1abc9c;border-color:#1abc9c}.task{flex:1;overflow-wrap:anywhere;font-size:16px}.done .task{text-decoration:line-through;color:#aab5bb}.icon{background:transparent;color:#9baab2;padding:5px 7px;font-size:20px}.empty{text-align:center;padding:40px 10px;color:#95a5a6}.empty[hidden]{display:none}.progress{height:6px;background:#edf1f2;border-radius:8px;margin-top:20px;overflow:hidden}.bar{height:100%;width:0;background:#1abc9c;transition:width .2s}.footer{display:flex;align-items:center;justify-content:space-between;margin-top:15px;color:#95a5a6;font-size:13px}.clear{background:transparent;color:#95a5a6;padding:8px}.hint{text-align:center;margin-top:23px;color:#9eacb3;font-size:12px}@media(max-width:480px){main{margin:28px auto}h1{font-size:38px}.panel{padding:16px}.tabs button{flex:1;padding:11px 4px}.add button{padding:10px}}
.christmas{margin-bottom:34px}.christmas-heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.christmas-tag{font-size:15px;font-weight:800;color:#fff;background:#2ecc71;border-radius:7px;padding:11px 16px}.christmas-panel{margin-top:15px;border-top:4px solid #b94d4d}.christmas-list li{padding:13px 0}.christmas-list .done .check{background:#247d62;border-color:#247d62}.christmas-edit{background:transparent;color:#95a5a6;padding:6px;font-size:18px}.christmas{position:relative}.christmas-heading{position:relative}.christmas-tag{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(110deg,#176b4b,#23865a)!important;color:#fff!important;border:2px solid #e5c77a!important;box-shadow:0 3px 0 #b53b40,0 6px 18px #1c5c4030;letter-spacing:.2px}.christmas-panel{position:relative;background:repeating-linear-gradient(135deg,#fbfffc 0px,#fbfffc 18px,#f1f8f2 18px,#f1f8f2 36px)!important;border:1px solid #dce9dd!important;border-top:5px solid #b73e44!important;box-shadow:0 8px 28px #1c5c4018!important;overflow:hidden}.christmas-panel:before{content:'✦  ❄  ✦  ❄  ✦';display:block;text-align:center;color:#b73e44;letter-spacing:14px;font-size:13px;padding:0 0 11px;border-bottom:1px solid #dce8dd;margin-bottom:3px}.christmas-panel:after{content:'✦';position:absolute;right:12px;bottom:8px;color:#d6b96c;font-size:18px;pointer-events:none}.christmas-list li{border-bottom:1px dashed #d5e3d7!important}.christmas-list .check{border-color:#34805f!important}.christmas-list .done .check{background:#247d62!important;border-color:#247d62!important}.christmas-list .task{color:#355647}.christmas-list .done .task{color:#9bad9f}.christmas-edit{color:#738d7e!important}@media(prefers-reduced-motion:no-preference){.christmas-tag{transition:transform .15s}.christmas-tag:hover{transform:translateY(-1px)}}.christmas{margin:24px 0 30px}.christmas-panel{margin-top:0!important;padding-top:0!important}.christmas-card-header{background:#176b4b;color:white;font-weight:800;font-size:17px;margin:0 -24px 14px;padding:15px 22px;border-bottom:3px solid #d8bd6a}.christmas-panel:before{margin-top:12px}@media(max-width:480px){.christmas-card-header{margin-left:-16px;margin-right:-16px;padding:14px 16px}}</style></head><body><header><div class="inner"><button type="button" class="see-all" disabled aria-label="See all, coming soon">See all</button><a class="header-toggle" href="../">← Back to Today</a></div></header><main><div class="eyebrow">Max's to-dos</div><h1>max game</h1><p>DC levels and PS5 release</p><section class="christmas"><div class="panel christmas-panel"><div class="christmas-card-header">🎄 Christmas deadline!</div><ul class="christmas-list" id="christmas-items"></ul></div></section><section class="panel"><form class="add" id="form"><input id="entry" placeholder="What needs doing?" maxlength="250" aria-label="New task" required autocomplete="off"><button type="submit">+ Add</button></form><ul id="items"></ul><div id="empty" class="empty">Nothing here yet. Add a task above.</div><div class="progress"><div class="bar" id="bar"></div></div><div class="footer"><span id="count">0 tasks left</span></div></section></main>
<script>
const CHRISTMAS_KEY='flatlist.game.christmas.tasks.v1';
const CHRISTMAS_DEFAULTS=['Add Micky','Add Sammy','Add Talulah','Add Garrett','Add Rahla','Add Jason','Add Suzanne','Add Stephanie',"Change the function of Adam's item"];
let christmasTasks;
try{christmasTasks=JSON.parse(localStorage.getItem(CHRISTMAS_KEY)||'null')}catch(e){}
if(!Array.isArray(christmasTasks))christmasTasks=CHRISTMAS_DEFAULTS.map(text=>({text,done:false}));
function saveChristmas(){try{localStorage.setItem(CHRISTMAS_KEY,JSON.stringify(christmasTasks))}catch(e){alert('Could not save Christmas tasks')}}
function renderChristmas(){
 const list=document.getElementById('christmas-items');list.replaceChildren();
 christmasTasks.forEach(t=>{
  const li=document.createElement('li');if(t.done)li.className='done';
  const check=document.createElement('button');check.type='button';check.className='check';check.textContent=t.done?'✓':'';check.setAttribute('aria-label',t.done?'Mark incomplete':'Mark complete');check.onclick=()=>{t.done=!t.done;saveChristmas();renderChristmas()};
  const label=document.createElement('span');label.className='task';label.textContent=t.text;
  const edit=document.createElement('button');edit.type='button';edit.className='christmas-edit';edit.textContent='✎';edit.setAttribute('aria-label','Edit Christmas task');edit.onclick=()=>{const v=prompt('Edit task',t.text);if(v!==null&&v.trim()){t.text=v.trim();saveChristmas();renderChristmas()}};
  li.append(check,label,edit);list.append(li);
 });
}
saveChristmas();renderChristmas();
const KEY='flatlist.game.tasks.v1';
const MIGRATION_KEY=KEY+'.chronological.v1';
const ORDER_MIGRATION_KEY=KEY+'.manual-order.v1';
const SHOW_DATES=false;
let tasks=[];
try {
  const stored=JSON.parse(localStorage.getItem(KEY)||'[]');
  if(Array.isArray(stored)) tasks=stored.filter(t=>t&&typeof t.text==='string').map(t=>({
    id:String(t.id),text:t.text,done:!!t.done,completedAt:typeof t.completedAt==='string'?t.completedAt:null
  }));
  // Older versions inserted new tasks at the beginning; migrate once to oldest-first.
  if(localStorage.getItem(MIGRATION_KEY)!=='yes'){
    tasks.reverse();
    localStorage.setItem(KEY,JSON.stringify(tasks));
    localStorage.setItem(MIGRATION_KEY,'yes');
  }
  if(localStorage.getItem(ORDER_MIGRATION_KEY)!=='yes'){
    tasks.reverse();
    localStorage.setItem(KEY,JSON.stringify(tasks));
    localStorage.setItem(ORDER_MIGRATION_KEY,'yes');
  }
}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){alert('Could not save tasks. Check browser storage settings.')}}
function render(){
  $('items').replaceChildren();
  $('empty').hidden=tasks.length!==0;
  tasks.forEach(t=>{
    const li=document.createElement('li');li.dataset.id=t.id;
    const handle=document.createElement('button');handle.type='button';handle.className='drag-handle';handle.textContent='⠿';handle.title='Drag to reorder';handle.setAttribute('aria-label','Drag to reorder '+t.text);handle.addEventListener('pointerdown',e=>startDrag(e,li,handle));handle.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const at=tasks.findIndex(x=>x.id===t.id);const next=at+(e.key==='ArrowUp'?-1:1);if(next>=0&&next<tasks.length){[tasks[at],tasks[next]]=[tasks[next],tasks[at]];save();render();$('items').children[next].querySelector('.drag-handle').focus()}}});
    if(t.done)li.className='done';
    const check=document.createElement('button');
    check.className='check';check.type='button';check.textContent=t.done?'✓':'';
    check.setAttribute('aria-label',t.done?'Mark incomplete':'Mark complete');
    check.onclick=()=>{t.done=!t.done;t.completedAt=t.done?new Date().toISOString():null;save();render()};
    const wrap=document.createElement('div');wrap.className='task-wrap';
    const label=document.createElement('span');label.className='task';label.textContent=t.text;wrap.append(label);
    if(SHOW_DATES&&t.done&&t.completedAt){
      const date=document.createElement('small');date.className='completed-date';
      date.textContent='Completed '+new Date(t.completedAt).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
      wrap.append(date);
    }
    const edit=document.createElement('button');edit.type='button';edit.className='icon';edit.textContent='✎';
    edit.setAttribute('aria-label','Edit task');
    edit.onclick=()=>{const v=prompt('Edit task',t.text);if(v!==null&&v.trim()){t.text=v.trim();save();render()}};
    const del=document.createElement('button');del.type='button';del.className='icon';del.textContent='×';
    del.setAttribute('aria-label','Delete task');
    del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()};
    li.append(handle,check,wrap,edit,del);$('items').append(li);
  });
  const left=tasks.filter(t=>!t.done).length;
  $('count').textContent=left+' task'+(left===1?'':'s')+' left';
  $('bar').style.width=(tasks.length?100*(tasks.length-left)/tasks.length:0)+'%';
}
$('form').onsubmit=e=>{
  e.preventDefault();const v=$('entry').value.trim();if(!v)return;
  tasks.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2),text:v,done:false,completedAt:null});
  $('entry').value='';save();render();$('entry').focus();
};

let drag=null;
function startDrag(e,li,handle){
  if((e.pointerType==='mouse'&&e.button!==0)||drag)return;
  e.preventDefault();
  drag={li,handle,pointerId:e.pointerId,targetId:li.dataset.id,before:true};
  li.classList.add('dragging');
  document.addEventListener('pointermove',moveDrag,{passive:false});
  document.addEventListener('pointerup',endDrag);
  document.addEventListener('pointercancel',cancelDrag);
}
function moveDrag(e){
  if(!drag||e.pointerId!==drag.pointerId)return;
  e.preventDefault();
  const list=$('items');
  const rows=[...list.children];
  const target=rows.find(row=>e.clientY<row.getBoundingClientRect().bottom)||rows[rows.length-1];
  if(!target)return;
  rows.forEach(row=>row.classList.remove('drag-target'));
  target.classList.add('drag-target');
  drag.targetId=target.dataset.id;
  drag.before=e.clientY<target.getBoundingClientRect().top+target.getBoundingClientRect().height/2;
  if(e.clientY<70)window.scrollBy(0,-10);
  if(e.clientY>window.innerHeight-70)window.scrollBy(0,10);
}
function cleanupDrag(){
  document.removeEventListener('pointermove',moveDrag);
  document.removeEventListener('pointerup',endDrag);
  document.removeEventListener('pointercancel',cancelDrag);
  $('items').querySelectorAll('.drag-target,.dragging').forEach(el=>el.classList.remove('drag-target','dragging'));
}
function cancelDrag(e){if(!drag||e.pointerId!==drag.pointerId)return;cleanupDrag();drag=null}
function endDrag(e){
  if(!drag||e.pointerId!==drag.pointerId)return;
  const {li,targetId,before}=drag;
  cleanupDrag();drag=null;
  if(targetId===li.dataset.id)return;
  const from=tasks.findIndex(t=>t.id===li.dataset.id);
  if(from<0)return;
  const [moved]=tasks.splice(from,1);
  const targetIndex=tasks.findIndex(t=>t.id===targetId);
  if(targetIndex<0){tasks.splice(from,0,moved);return}
  tasks.splice(targetIndex+(before?0:1),0,moved);
  save();render();
}
render();
</script></body></html>
